  msgOrderStatus:
    type: string
    enum:
      - UNKNOWN_OrderStatus
      - ORDER_POSTED
      - ORDER_CREATED
      - ORDER_ACTIVATED
      - ORDER_COLLECTED
      - ORDER_COMPLETED
      - ORDER_PAID
      - ORDER_CANCELLED
      - ORDER_IN_DELIVERY
      - ORDER_READY_FOR_DELIVERY
      - ORDER_UNFULFILLED
      - ORDER_RETURNED_TO_SHELVES
      - ORDER_RETURNED_TO_SHOP
      - ORDER_IN_ASSEMBLY
      - ORDER_PAYMENT_PROCESSING
    default: UNKNOWN_OrderStatus
    description: |-
      OrderStatus список статусов заказа.

       - ORDER_CREATED: Название статуса в монолите - "Оформлен", является первоначальным статусом заказа при создании, заказ остаётся в этом статусе после создания до начала его дальнейшей обработки.
       - ORDER_COMPLETED: Название статуса в монолите - "Успешно завершен". Заказ успешно завершён.
       - ORDER_PAID: Название статуса в монолите - "Оплачен", судя по всему, используется только в заказах Рационов. Означает, что по заказу была произведена оплата. Заказ Рациона находится в этом статусе до своего завершения.
       - ORDER_CANCELLED: Название статуса в монолите - "Отменен", заказ переводится в этот статус в результате отмены. Является терминальным для заказа.
       - ORDER_IN_DELIVERY: Название статуса в монолите - "Доставка", заказ находится в этом статусе в процессе доставки.
       - ORDER_READY_FOR_DELIVERY: Название статуса в монолите - "Готов". Заказ находится в этом статусе после завершения сборки и оплаты, до начала доставки.
       - ORDER_UNFULFILLED: Название статуса в монолите - "Не выполнен". Заказ не удалось доставить/завершить.
       - ORDER_RETURNED_TO_SHELVES: Название статуса в монолите - "Вернулся на полки". Заказ вернулся на полки.
       - ORDER_RETURNED_TO_SHOP: Название статуса в монолите - "Вернулся в магазин". Заказ вернулся на полки.
       - ORDER_IN_ASSEMBLY: Название статуса в монолите - "Сборка", заказ находится в этом статусе в процессе сборки.
       - ORDER_PAYMENT_PROCESSING: Название статуса в монолите - "В процессе оплаты", промежуточный статус между ORDER_CREATED и ORDER_PAID.
  msgOrderType:
    type: string
    enum:
      - UNKNOWN_OrderType
      - certificate
      - darkkitchen
      - regular_order
      - ration
      - scan_yourself
      - external_order
      - celebration
      - internal_order_with_delivery
      - additional
      - water
      - delivery_for_external_service
      - obed_ru_b2b
    default: UNKNOWN_OrderType
    description: |-
      тип заказа.

       - certificate: Заказ подарочных сертификатов ВВ
       - darkkitchen: ЕСЛИ источник заказа (source) = darkkitchen, ТОГДА тип заказа darkkitchen
       - regular_order: "Закажи и забери", самый обычный заказ Вкусвилла.
       - ration: Рационы
       - scan_yourself: Сканируй сам (Покупатель в магазине сам сканирует все товары через телефон и оплачивает на кассе)
       - external_order: Заказ сторонней организации (Маркетплейсы)
       - celebration: Праздники (Праздничные блюда)
       - internal_order_with_delivery: ЕСЛИ источник заказа (source) != darkkitchen, ТОГДА тип заказа internal_order_with_delivery
       - additional: Довозы (забыли положить часть товаров к основному заказу)
       - water: Заказ воды (вода от партнёров)
       - delivery_for_external_service: Доставка заказов сторонних организаций курьерской службой ВВ
       - obed_ru_b2b: B2B заказы по Обед.ру
